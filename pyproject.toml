[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "forecasting"
version = "0.1.0"
description = "Demand forecasting project used to demo an end-to-end agentic SDLC"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.1",
    "numpy>=1.26",
    "statsmodels>=0.14",
    "scikit-learn>=1.4",
    "matplotlib>=3.8",
    "pyyaml>=6.0",
    "jsonschema>=4.21",
]

[project.optional-dependencies]
# Intentionally not a default dependency. "Add a Prophet model" is one of the
# feature requests the agent pipeline is expected to implement, and enabling it
# should be a deliberate change to this file.
prophet = ["prophet>=1.1.5"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "nbmake>=1.5",
    "nbstripout>=0.7",
    "ruff>=0.6",
    "jupyter>=1.0",
    "ipykernel>=6.29",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "RUF"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
# Notebooks are read top to bottom, so a plotting call that runs long is easier
# to follow on one line than wrapped across six.
"notebooks/*.ipynb" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "slow: marks tests that take more than a couple of seconds",
]
filterwarnings = [
    "ignore::FutureWarning",
    "ignore::UserWarning",
]
