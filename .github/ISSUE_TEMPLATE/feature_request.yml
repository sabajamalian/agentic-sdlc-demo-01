name: Feature request
description: A scoped change to the forecasting project
title: "[feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Issues in this repository are usually generated from a meeting
        transcript and approved on a proposals issue, then assigned to the
        Copilot cloud agent. This template mirrors the structure the transcript
        agent produces, so hand-written issues are just as actionable.

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is wrong or missing today, and why it matters.
      placeholder: The backtest reports a single aggregate MAPE, so a model that is badly wrong on one SKU still looks fine.
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Specific, checkable outcomes. The agent treats these as the definition of done.
      value: |
        - [ ] 
        - [ ] 
        - [ ] Tests cover the new behaviour
        - [ ] `make check` passes
    validations:
      required: true

  - type: textarea
    id: files
    attributes:
      label: Files likely involved
      description: Best guess at where the change lands. Not binding.
      placeholder: |
        - src/forecasting/evaluate.py
        - scripts/run_backtest.py
        - tests/test_evaluate.py

  - type: dropdown
    id: size
    attributes:
      label: Size
      options:
        - small
        - medium
        - large
    validations:
      required: true

  - type: textarea
    id: notes
    attributes:
      label: Notes and constraints
      description: Anything the implementer needs to know. Look-ahead risks, threshold impact, dependencies.

  - type: checkboxes
    id: guardrails
    attributes:
      label: Guardrails
      options:
        - label: This change must not loosen `eval/thresholds.yml`
          required: false
        - label: This change adds a new runtime dependency
          required: false
