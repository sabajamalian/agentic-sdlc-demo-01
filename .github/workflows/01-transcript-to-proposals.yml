name: 01 - Transcript to feature proposals

# Reads a meeting transcript, has Copilot CLI turn it into schema-validated
# proposals, and opens one "Feature Proposals" issue for a human to approve.
#
# Requires the AGENT_PAT secret: a fine-grained PAT with the account-level
# "Copilot Requests" permission plus repo read/write on contents, issues and
# pull requests. The default GITHUB_TOKEN cannot be used, because events it
# creates do not trigger the downstream approval workflow.

on:
  push:
    branches: [main]
    paths:
      - "docs/transcripts/**.md"
  workflow_dispatch:
    inputs:
      transcript_path:
        description: "Path to the transcript, e.g. docs/transcripts/2026-07-15-forecasting-planning.md"
        required: true
        type: string
      model:
        description: "Model for the agent to use (blank uses the CLI default)"
        required: false
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: transcript-to-proposals
  cancel-in-progress: false

jobs:
  parse:
    name: Parse transcript
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve the transcript to process
        id: transcript
        env:
          INPUT_PATH: ${{ inputs.transcript_path }}
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          if [ -n "${INPUT_PATH}" ]; then
            transcript="${INPUT_PATH}"
          else
            # Every transcript touched anywhere in this push, not just the last
            # commit. The paths filter matches the whole push range, so diffing
            # HEAD^..HEAD would silently find nothing when the transcript is
            # pushed alongside a follow-up commit.
            base="${BEFORE_SHA}"
            if [ -z "${base}" ] || ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
              # New branch, or the base commit is not reachable. Diff against the
              # empty tree so every transcript in the push is considered.
              base="$(git hash-object -t tree /dev/null)"
            fi

            transcript="$(git diff --name-only --diff-filter=AM "${base}" "${AFTER_SHA}" \
              -- 'docs/transcripts/*.md' | tail -1)"
          fi

          if [ -z "${transcript}" ]; then
            echo "::notice::No transcript file changed in this push. Nothing to do."
            echo "found=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ ! -f "${transcript}" ]; then
            echo "::error::Transcript not found: ${transcript}"
            exit 1
          fi

          echo "Processing ${transcript}"
          echo "found=true" >> "$GITHUB_OUTPUT"
          echo "path=${transcript}" >> "$GITHUB_OUTPUT"

      - name: Verify AGENT_PAT is configured
        if: steps.transcript.outputs.found == 'true'
        env:
          AGENT_PAT: ${{ secrets.AGENT_PAT }}
        run: |
          if [ -z "${AGENT_PAT}" ]; then
            echo "::error::The AGENT_PAT secret is not set. See docs/runbook.md."
            exit 1
          fi

      - uses: actions/setup-node@v4
        if: steps.transcript.outputs.found == 'true'
        with:
          node-version: "22"

      - uses: actions/setup-python@v5
        if: steps.transcript.outputs.found == 'true'
        with:
          python-version: "3.12"

      - name: Install tooling
        if: steps.transcript.outputs.found == 'true'
        run: |
          npm install -g @github/copilot
          pip install jsonschema
          copilot --version || true

      - name: Run the transcript agent
        if: steps.transcript.outputs.found == 'true'
        id: agent
        env:
          # Copilot CLI reads COPILOT_GITHUB_TOKEN first. It must be a
          # user-to-server token with the "Copilot Requests" permission.
          COPILOT_GITHUB_TOKEN: ${{ secrets.AGENT_PAT }}
          TRANSCRIPT: ${{ steps.transcript.outputs.path }}
          MODEL: ${{ inputs.model }}
        run: |
          set -uo pipefail

          prompt="$(cat .github/agent-prompts/transcript-to-proposals.md)

          The transcript to process is: ${TRANSCRIPT}

          Read it now and write proposals.json as specified above."

          args=(--yolo -s)
          if [ -n "${MODEL}" ]; then
            args+=("--model=${MODEL}")
          fi
          args+=(-p "${prompt}")

          set +e
          copilot "${args[@]}" 2>&1 | tee agent-output.txt
          status=$?
          set -e

          echo "agent exit status: ${status}"
          if [ ! -f proposals.json ]; then
            echo "::error::The agent did not write proposals.json. See the agent-output artifact."
            exit 1
          fi

      - name: Render the proposals issue
        if: steps.transcript.outputs.found == 'true'
        env:
          TRANSCRIPT: ${{ steps.transcript.outputs.path }}
        run: |
          python scripts/proposals_to_issue.py \
            --proposals proposals.json \
            --source-transcript "${TRANSCRIPT}" \
            --body-out issue_body.md \
            --title-out issue_title.txt \
            --run-url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

      - name: Upload agent output
        if: always() && steps.transcript.outputs.found == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: transcript-agent-${{ github.run_id }}
          path: |
            proposals.json
            agent-output.txt
            issue_body.md
          if-no-files-found: warn
          retention-days: 14

      - name: Open the Feature Proposals issue
        if: steps.transcript.outputs.found == 'true'
        env:
          GH_TOKEN: ${{ secrets.AGENT_PAT }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          title="$(cat issue_title.txt)"
          url="$(gh issue create \
            --title "${title}" \
            --body-file issue_body.md \
            --label feature-proposals \
            --label agent-generated)"

          echo "Opened ${url}"
          {
            echo "## Feature proposals ready for review"
            echo
            echo "${url}"
            echo
            echo "Comment \`/approve\` on that issue to create the individual issues"
            echo "and hand them to the Copilot cloud agent."
          } >> "$GITHUB_STEP_SUMMARY"
