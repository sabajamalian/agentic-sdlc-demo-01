name: Post-merge eval

# Runs the full backtest on main after a merge, so the repository always has a
# current record of model accuracy independent of any pull request.

on:
  push:
    branches: [main]
  schedule:
    # Monday 06:00 UTC, to catch drift from dependency updates.
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: post-merge-eval
  cancel-in-progress: false

jobs:
  eval:
    name: Backtest main
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run backtest
        run: python scripts/run_backtest.py --plot

      - name: Check thresholds
        id: gate
        continue-on-error: true
        run: python scripts/check_eval_gate.py

      - name: Publish summary
        if: always()
        run: |
          if [ -f reports/eval_summary.md ]; then
            cat reports/eval_summary.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No eval summary was produced." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: main-backtest-${{ github.run_id }}
          path: |
            reports/metrics.json
            reports/eval_summary.md
            reports/mape_by_model.png
          retention-days: 90
          if-no-files-found: warn

      - name: Fail on regression
        if: steps.gate.outcome == 'failure'
        run: |
          echo "::error::main is below the thresholds in eval/thresholds.yml"
          exit 1
